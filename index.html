<style>
body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:20px}
h1{margin:0 0 4px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#111;padding:10px 0;z-index:2;border-bottom:1px solid #333}
.total{font-size:26px;font-weight:700;color:#7f7}button,select{background:#2a2a2a;color:#eee;border:1px solid #555;padding:7px 12px;border-radius:6px;cursor:pointer}
h2{margin:22px 0 8px;color:#9cf}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}.card.off{opacity:.4}
.card img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:6px}.noimg{height:150px;display:flex;align-items:center;justify-content:center;background:#222;border-radius:6px;color:#666}
.name{font-weight:600}.row{display:flex;justify-content:space-between;align-items:center;gap:6px}.price{font-size:20px;font-weight:700}
.badge{font-size:12px;padding:2px 8px;border-radius:10px}.in{background:#1a5;color:#fff}.out{background:#a33;color:#fff}.unk{background:#555}
a.buy{background:#f80;color:#000;text-decoration:none;padding:6px 12px;border-radius:6px;font-weight:700}input[type=number]{width:50px}
.cmp{font-size:12px;color:#aaa}.cmp a{color:#9cf}.err{color:#f99;font-size:11px}
@media (max-width:640px){body{padding:10px}.grid{grid-template-columns:1fr}.bar{gap:8px}.total{font-size:22px;width:100%}
button,select,a.buy{min-height:44px;font-size:16px}a.buy{display:inline-flex;align-items:center;padding:0 18px}
input[type=number]{width:64px;height:40px;font-size:16px}input[type=checkbox]{width:26px;height:26px}.card select{max-width:65%}}
</style></head><body>

shortsaver-v2-smart-smoke-stopper"}, {"price": 17.49, "currency": "", "in_stock": true, "image": "https://cdn.shopify.com/s/files/1/1285/4651/products/vifly-vifly-short-saver-2-smoke-stopper-xt30-xt60-tool-16334400684145.jpg?v=1762441078", "method": "shopify-json", "error": "", "store": "RaceDayQuads", "url": "https://www.racedayquads.com/products/vifly-short-saver-2-smoke-stopper-xt30-xt60"}, {"price": 14.3, "currency": "USD", "in_stock": true, "image": "https://s3.amazonaws.com/content.readymaderc.com/product_images/images/000/022/249/half_thumb/tyuitu77.jpg?1778676521", "method": "json-ld", "error": "", "store": "RMRC", "url": "https://www.readymaderc.com/products/details/86827-vifly-shortsaver-2-smart-smoke-stopper-xt60-xt30"}]}, {"group": "tools", "id": "heatshrink", "name": "Heat Shrink Assortment 508pc", "qty": 1, "optional": false, "stores": [{"price": 22.99, "currency": "USD", "in_stock": true, "image": "https://www.getfpv.com/media/catalog/product/h/e/heat-shrink-box.jpg", "method": "json-ld", "error": "", "store": "GetFPV", "url": "https://www.getfpv.com/heat-shrink-tube-assortment-box-508pcs-black.html"}]}]};
const G={core:"Core build",radio:"Radio / power",tools:"Tools"};
const st=JSON.parse(localStorage.getItem("dd3")||"{}");
DATA.items.forEach(it=>{const s=st[it.id]||{};it.inc=s.inc??!it.optional;it.q=s.q??it.qty;it.sel=s.sel??bestIdx(it)});
function bestIdx(it){if(it.preferred!=null)return it.preferred;const u=it.stores.map((s,i)=>[s,i]).filter(([s])=>s.price!=null&&(!s.currency||s.currency==="USD"));if(!u.length)return 0;const ins=u.filter(([s])=>s.in_stock===true);const pool=ins.length?ins:u;pool.sort((a,b)=>a[0].price-b[0].price);return pool[0][1]}
function save(){const o={};DATA.items.forEach(i=>o[i.id]={inc:i.inc,q:i.q,sel:i.sel});localStorage.setItem("dd3",JSON.stringify(o))}
const fmt=(p,c)=>p==null?"—":(c&&c!=="USD"?c+" ":"$")+p.toFixed(2);
function cur(it){return it.stores[it.sel]}
function render(){
 const m=document.getElementById("main");m.innerHTML="";
 const mode=document.getElementById("sort").value;
 let groups=mode==="group"?Object.keys(G).map(g=>[G[g],DATA.items.filter(i=>i.group===g)]):[["All parts",[...DATA.items].sort((a,b)=>{const pa=cur(a).price??1e9,pb=cur(b).price??1e9;return mode==="asc"?pa-pb:pb-pa})]];
 for(const [title,list] of groups){
  const h=document.createElement("h2");h.textContent=title;m.appendChild(h);
  const gr=document.createElement("div");gr.className="grid";m.appendChild(gr);
  for(const it of list){const s=cur(it);const c=document.createElement("div");c.className="card"+(it.inc?"":" off");
   const badge=s.in_stock===true?'<span class="badge in">In stock</span>':s.in_stock===false?'<span class="badge out">Out of stock</span>':'<span class="badge unk">Stock ?</span>';
   const line=s.price!=null?s.price*it.q:null;
   c.innerHTML=(s.image?`<img src="${s.image}" loading="lazy">`:'<div class="noimg">no image</div>')+
   `<div class="row"><span class="name">${it.name}</span><label><input type="checkbox" ${it.inc?"checked":""} data-inc="${it.id}"> incl</label></div>
   <div class="row"><select data-sel="${it.id}">${it.stores.map((x,i)=>`<option value="${i}" ${i==it.sel?"selected":""}>${x.store} ${fmt(x.price,x.currency)}</option>`).join("")}</select>${badge}</div>
   <div class="row"><span class="price">${fmt(s.price,s.currency)}</span><span>Qty <input type="number" min="0" value="${it.q}" data-q="${it.id}"></span></div>
   <div class="row"><span>Line: <b>${fmt(line,s.currency)}</b></span><a class="buy" href="${s.url}" target="_blank" rel="noopener">Buy ↗</a></div>
   ${s.error?`<div class="err">${s.error} (see store page)</div>`:""}`;
   gr.appendChild(c)}}
 let t=0,miss=0;DATA.items.filter(i=>i.inc).forEach(i=>{const s=cur(i);if(s.price!=null&&(!s.currency||s.currency==="USD"))t+=s.price*i.q;else miss++});
 document.getElementById("total").textContent="Total $"+t.toFixed(2)+(miss?` (+${miss} unpriced/non-USD)`:"");
 document.getElementById("ref").textContent="Last refreshed: "+new Date(DATA.refreshed).toLocaleString();
}
document.addEventListener("change",e=>{const d=e.target.dataset,f=id=>DATA.items.find(i=>i.id===id);
 if(d.inc)f(d.inc).inc=e.target.checked;if(d.sel)f(d.sel).sel=+e.target.value;if(d.q)f(d.q).q=Math.max(0,+e.target.value||0);
 if(e.target.id!=="sort")save();render()});
document.getElementById("openall").onclick=()=>DATA.items.filter(i=>i.inc).forEach(i=>window.open(cur(i).url,"_blank"));
render();
</script></body></html>
